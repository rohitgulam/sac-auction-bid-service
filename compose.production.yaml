name: auction-bid-service-prod

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile.production
        restart: unless-stopped
        env_file:
            - .env.production
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
            DB_HOST: postgres
            DB_PORT: '5432'
        ports:
            - '127.0.0.1:8088:80'
        volumes:
            - app_storage:/var/www/html/storage
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1/up']
            interval: 30s
            timeout: 5s
            retries: 3

    postgres:
        image: postgres:17
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:?Set DB_DATABASE in .env.production}
            POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.production}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    app_storage:
    postgres_data:

name: auction-bid-service

services:
    postgres:
        image: postgres:17
        environment:
            POSTGRES_DB: ${DB_DATABASE:-sac_auction}
            POSTGRES_USER: ${DB_USERNAME:-sac_auction}
            POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
        ports:
            - "127.0.0.1:${DB_PORT:-55432}:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
            interval: 5s
            timeout: 3s
            retries: 10
        volumes:
            - postgres_data:/var/lib/postgresql/data

volumes:
    postgres_data:
